openapi: 3.1.0
info:
  title: Connector Service API
  description: The Connector Service provides a unified API for accessing Data Products,
    validating Contracts, and logging Transactions in the NextGen node.
  contact:
    name: HIRO-MicroDataCenters
    email: all-hiro@hiro-microdatacenters.nl
  license:
    name: MIT
    url: https://github.com/HIRO-MicroDataCenters-BV/ds-connector-service/blob/main/LICENSE
  version: 0.1.0
paths:
  /metrics:
    get:
      summary: Metrics
      description: Endpoint that serves Prometheus metrics.
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /connector-metadata:
    get:
      tags:
      - Data Products
      summary: Get Connector Metadata
      description: 'partial(func, *args, **keywords) - new function with partial application

        of the given arguments and keywords.'
      operationId: get_connector_metadata
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorMetadata'
  /distribution-metadata/{interface_id}/{resource_path}:
    get:
      tags:
      - Data Products
      summary: Get Distribution Metadata
      description: Return Metadata for a distribution along with region.
      operationId: get_distribution_metadata
      parameters:
      - name: interface_id
        in: path
        required: true
        schema:
          type: string
          title: Interface Id
      - name: resource_path
        in: path
        required: true
        schema:
          type: string
          title: Resource Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /distribution-content/{interface_id}/{resource_path}/chunk:
    get:
      tags:
      - Data Products
      summary: Get Data Product Chunk
      description: Return a dataset chunk (partial CSV content).
      operationId: get_dataproduct_chunk
      parameters:
      - name: interface_id
        in: path
        required: true
        schema:
          type: string
          title: Interface Id
      - name: resource_path
        in: path
        required: true
        schema:
          type: string
          title: Resource Path
      - name: range_header
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: HTTP Range header for partial content requests
          title: Range Header
        description: HTTP Range header for partial content requests
        example: bytes=0-1023
      responses:
        '200':
          description: Full chunk when no range specified
          content:
            application/json:
              schema: {}
        '206':
          description: Partial content chunk
          content:
            text/csv:
              example: 'partial,data

                '
          headers:
            Content-Range:
              description: Range of bytes returned
              schema:
                type: string
                example: bytes=0-1023
        '404':
          description: Data product not found
        '416':
          description: Range not satisfiable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /distribution-content/{interface_id}/{resource_path}:
    get:
      tags:
      - Data Products
      summary: Get Data Product Content
      description: Return the full dataset content.
      operationId: get_dataproduct_content
      parameters:
      - name: interface_id
        in: path
        required: true
        schema:
          type: string
          title: Interface Id
      - name: resource_path
        in: path
        required: true
        schema:
          type: string
          title: Resource Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /dataproduct-distributions/{interface_id}/{directory_resource_path}:
    get:
      tags:
      - Data Products
      summary: List Data Product Distributions
      description: Return a paginated list of data product distributions with region.
      operationId: list_dataproduct_distributions
      parameters:
      - name: interface_id
        in: path
        required: true
        schema:
          type: string
          title: Interface Id
      - name: directory_resource_path
        in: path
        required: true
        schema:
          type: string
          title: Directory Resource Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataProductItem'
                title: Response List Dataproduct Distributions
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /dataproducts/{interface_id}:
    get:
      tags:
      - Data Products
      summary: List Data Products
      description: List available data products from the base path.
      operationId: list_dataproducts
      parameters:
      - name: interface_id
        in: path
        required: true
        schema:
          type: string
          title: Interface Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                title: Response List Dataproducts
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /interface-health-read/{interface_id}:
    get:
      tags:
      - Health
      summary: Read Health Check
      description: Perform health check on the specified interface.
      operationId: health_check_read
      parameters:
      - name: interface_id
        in: path
        required: true
        schema:
          type: string
          title: Interface Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /distribution-upload/{interface_id}/{resource_path}:
    post:
      tags:
      - Data Products
      summary: Upload Data Product
      description: "Upload a complete data product file or JSON data\n\nSupports two\
        \ upload methods:\n1. Multipart file upload: Use form-data with file field\n\
        2. Direct JSON/data upload: Send JSON/text directly in request body\n\nArgs:\n\
        \    request: FastAPI request object\n    interface_id: Storage interface\
        \ (file, s3)\n    resource_path: Path where to store the data\n    file: File\
        \ to upload (for multipart uploads only)\n    content_type: Optional content\
        \ type override (for multipart uploads)\n    tags: Optional tags in format\
        \ \"key=value,key2=value2\"\n    usecases: Write use case dependency\n\nReturns:\n\
        \    Upload result information"
      operationId: upload_dataproduct
      parameters:
      - name: interface_id
        in: path
        required: true
        schema:
          type: string
          title: Interface Id
      - name: resource_path
        in: path
        required: true
        schema:
          type: string
          title: Resource Path
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_dataproduct'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /distribution-stream-upload/{interface_id}/{resource_path}:
    post:
      tags:
      - Data Products
      summary: Stream Upload Data Product
      description: "Upload a data product using streaming (memory-efficient for large\
        \ files/data)\n\nSupports two streaming methods:\n1. Multipart file streaming:\
        \ Stream file chunks\n2. Direct content streaming: Stream JSON/text data from\
        \ request body\n\nArgs:\n    request: FastAPI request object\n    interface_id:\
        \ Storage interface (file, s3)\n    resource_path: Path where to store the\
        \ data\n    file: File to stream upload (for multipart uploads only)\n   \
        \ content_type: Optional content type override (for multipart uploads)\n \
        \   tags: Optional tags\n    usecases: Write use case dependency\n\nReturns:\n\
        \    Upload result information"
      operationId: stream_upload_dataproduct
      parameters:
      - name: interface_id
        in: path
        required: true
        schema:
          type: string
          title: Interface Id
      - name: resource_path
        in: path
        required: true
        schema:
          type: string
          title: Resource Path
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_stream_upload_dataproduct'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /interface-health-write/{interface_id}:
    get:
      tags:
      - Health
      summary: Write Health Check
      description: "Perform health check on the write capabilities of the specified\
        \ interface\n\nArgs:\n    interface_id: Storage interface to test\n    usecases:\
        \ Write use case dependency\n\nReturns:\n    Health check result"
      operationId: health_check_write
      parameters:
      - name: interface_id
        in: path
        required: true
        schema:
          type: string
          title: Interface Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health-check:
    get:
      tags:
      - Health
      summary: Health check
      description: Returns a 200 status code if the service is up and running
      operationId: service_health_check
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
components:
  schemas:
    Body_stream_upload_dataproduct:
      properties:
        file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: File
          description: File to stream upload (for multipart uploads)
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
          description: Content type override (for multipart uploads)
        tags:
          anyOf:
          - type: string
          - type: 'null'
          title: Tags
          description: Comma-separated tags
      type: object
      title: Body_stream_upload_dataproduct
    Body_upload_dataproduct:
      properties:
        file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: File
          description: File to upload (for multipart uploads)
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
          description: Content type override (for multipart uploads)
        tags:
          anyOf:
          - type: string
          - type: 'null'
          title: Tags
          description: Comma-separated tags (key=value,key2=value2)
      type: object
      title: Body_upload_dataproduct
    ConnectorMetadata:
      properties:
        connector_id:
          type: string
          title: Connector Id
        region:
          type: string
          title: Region
        supported_interfaces:
          items:
            type: string
          type: array
          title: Supported Interfaces
        status:
          type: string
          title: Status
        version:
          type: string
          title: Version
      type: object
      required:
      - connector_id
      - region
      - supported_interfaces
      - status
      - version
      title: ConnectorMetadata
    DataProductDistribution:
      properties:
        access_service:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Service
        access_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Url
        byte_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Byte Size
        compress_format:
          anyOf:
          - type: string
          - type: 'null'
          title: Compress Format
        download_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Download Url
        media_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Media Type
        package_format:
          anyOf:
          - type: string
          - type: 'null'
          title: Package Format
        access_rights:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Rights
        conforms_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Conforms To
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        format:
          anyOf:
          - type: string
          - type: 'null'
          title: Format
        issued:
          anyOf:
          - type: string
          - type: 'null'
          title: Issued
        license:
          anyOf:
          - type: string
          - type: 'null'
          title: License
        modified:
          anyOf:
          - type: string
          - type: 'null'
          title: Modified
        rights:
          anyOf:
          - type: string
          - type: 'null'
          title: Rights
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        has_policy:
          anyOf:
          - type: string
          - type: 'null'
          title: Has Policy
        checksum:
          anyOf:
          - type: string
          - type: 'null'
          title: Checksum
      type: object
      title: DataProductDistribution
      description: Standardized metadata for resources across different sources
    DataProductItem:
      properties:
        distribution:
          items:
            $ref: '#/components/schemas/DataProductDistribution'
          type: array
          title: Distribution
        region:
          type: string
          title: Region
          default: ''
      type: object
      required:
      - distribution
      title: DataProductItem
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthCheck:
      properties:
        status:
          type: string
          title: Status
          examples:
          - OK
      type: object
      required:
      - status
      title: HealthCheck
    UploadResponse:
      properties:
        message:
          type: string
          title: Message
          description: Upload status message
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
          description: Upload result details
      type: object
      required:
      - message
      title: UploadResponse
      description: Response model for upload operations
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
