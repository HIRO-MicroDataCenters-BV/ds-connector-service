openapi: 3.1.0
info:
  title: Connector Service API
  description: The Connector Service provides a unified API for accessing Data Products,
    validating Contracts, and logging Transactions in the NextGen node.
  contact:
    name: HIRO-MicroDataCenters
    email: all-hiro@hiro-microdatacenters.nl
  license:
    name: MIT
    url: https://github.com/HIRO-MicroDataCenters-BV/ds-connector/blob/main/LICENSE
  version: 0.1.0
paths:
  /metrics:
    get:
      tags:
      - Monitoring
      summary: Metrics
      description: Return Prometheus metrics
      operationId: get_metrics
      responses:
        '200':
          description: Prometheus metrics
          content:
            application/json:
              schema: {}
  /data-products/:
    post:
      tags:
      - Data Products
      summary: Create Data Product
      description: Register a new data product (metadata only)
      operationId: create_data_product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Data Product
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '201':
          description: Data product created successfully
        '400':
          description: Invalid input
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Data Products
      summary: List Data Products
      description: Return paginated list of available data products
      operationId: list_data_products
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Page Size
      responses:
        '200':
          description: List of data products
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health-check/:
    get:
      tags:
      - Health
      summary: Health Check
      description: Check if the Connector service is running
      operationId: health_check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema: {}
  /data-products/{connector_id}/{data_product_id}/:
    get:
      tags:
      - Data Products
      summary: Get Data Product
      description: Return metadata for a specific data product
      operationId: get_data_product
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      - name: data_product_id
        in: path
        required: true
        schema:
          type: string
          title: Data Product Id
      responses:
        '200':
          description: Data product metadata
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Data Products
      summary: Delete Data Product
      description: Delete a data product (delegated to the underlying Interface)
      operationId: delete_data_product
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      - name: data_product_id
        in: path
        required: true
        schema:
          type: string
          title: Data Product Id
      responses:
        '200':
          description: Data product deleted successfully
          content:
            application/json:
              schema: {}
        '404':
          description: Data product not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /data-products/{connector_id}/{data_product_id}/content:
    get:
      tags:
      - Data Products
      summary: Get Data Product Content
      description: Retrieve data product content wrapped in MMIO
      operationId: get_data_product_content
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          title: Connector Id
      - name: data_product_id
        in: path
        required: true
        schema:
          type: string
          title: Data Product Id
      responses:
        '200':
          description: MMIO object with data product content
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /contracts/validate:
    post:
      tags:
      - Contracts
      summary: Validate Contract
      description: Validate a contract before allowing access to data
      operationId: validate_contract
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Contract
        required: true
      responses:
        '200':
          description: Contract is valid
          content:
            application/json:
              schema: {}
        '403':
          description: Invalid contract
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /transactions/:
    post:
      tags:
      - Transactions
      summary: Log Transaction
      description: Record a transaction in the Clearing House
      operationId: log_transaction
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Transaction
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '201':
          description: Transaction recorded
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
