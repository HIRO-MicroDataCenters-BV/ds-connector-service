name: Test, build and push connector

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test_and_build_connector:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./server
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-root --no-interaction --no-ansi

      - name: Run linters and type checks
        run: |
          poetry run mypy app
          poetry run flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          poetry run black --check app
          poetry run isort --check-only app

      - name: Run tests
        run: poetry run pytest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}


      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/hiro-microdatacenters-bv/ds-connector
          # Use tag from git ref (tag or branch SHA)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="dev-${GITHUB_SHA::7}"
          fi

          echo "Building image: $IMAGE:$TAG"
          docker build -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG
