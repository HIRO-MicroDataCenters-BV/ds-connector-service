name: Test and build client

on: [push, pull_request, workflow_dispatch]

jobs:
  test_and_build_client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry lock --check
          poetry install --no-root --no-interaction --no-ansi

      - name: Check code
        run: |
          poetry run mypy .
          poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          poetry run black --check .
          poetry run isort --check-only .

      - name: Run tests
        run: poetry run pytest

      # --- Publish section ---
      - name: Publish package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Detected tag: $TAG_NAME"

          if [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "➡ Publishing release $TAG_NAME to PyPI..."
            export POETRY_PYPI_TOKEN_PYPI="${{ secrets.PYPI_TOKEN }}"
            poetry build
            poetry publish
          else
            echo "➡ Publishing pre-release $TAG_NAME to TestPyPI..."
            poetry config repositories.testpypi https://test.pypi.org/legacy/
            export POETRY_PYPI_TOKEN_TESTPYPI="${{ secrets.TEST_PYPI_TOKEN }}"
            poetry build
            poetry publish -r testpypi
          fi
